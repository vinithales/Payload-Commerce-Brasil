services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: payloadcms-commerce
    restart: unless-stopped
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - payload_node_modules:/app/node_modules
      - payload_next:/app/.next
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payloadcms-commerce
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: payloadcms-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payloadcms-commerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d payloadcms-commerce
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  payload_node_modules:
  payload_next:
